global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'manga-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'auth-ms:8080'
          - 'catalog-ms:8080'
          - 'content-ms:8080'
          - 'tracking-ms:8080'
          - 'notif-ms:8080'